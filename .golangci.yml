version: "2"

run:
  timeout: 5m
  go: "1.26"
  modules-download-mode: readonly
  tests: true

# v2: formatters 獨立於 linters.
formatters:
  enable:
    - gofmt
    - goimports
    - gofumpt
  settings:
    gofumpt:
      extra-rules: true

# v2: govet, errcheck, staticcheck, gosimple, ineffassign, unused 已預設啟用，不需列出.
linters:
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - dupl
          - goconst
          - lll
      - path: tests/integration/
        linters:
          - typecheck
          - errcheck
          - lll

  enable:
    - misspell
    - asasalint
    - bidichk
    - bodyclose
    - contextcheck
    - copyloopvar
    - gocyclo
    - dupl
    - goconst
    - gocritic
    - godot
    - goprintffuncname
    - loggercheck
    - lll
    - makezero
    - nakedret
    - noctx
    - nilerr
    - nolintlint
    - unconvert
    - unparam
    - whitespace
    - gosec

  settings:
    gocyclo:
      min-complexity: 15
    dupl:
      threshold: 50
    goconst:
      min-len: 1
      min-occurrences: 3
      match-constant: false
    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    lll:
      line-length: 140
    misspell:
      locale: US
    gosec:
      excludes:
        - G114
        - G304
        - G404
    nolintlint:
      require-explanation: true
      require-specific: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      colors: true

severity:
  default: error
