name: CI/CD

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.11"

      - name: Go vet
        run: go vet ./...

      - name: Go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # [F241-01] pinned govulncheck + repo-side allowlist gate (see scripts/ci/govulncheck-allow.txt)
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Govulncheck gate self-test
        run: bash scripts/ci/govulncheck-gate_test.sh

      - name: Govulncheck
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/govulncheck" -format json ./cmd/... ./internal/... > "$RUNNER_TEMP/govulncheck.json"
          bash scripts/ci/govulncheck-gate.sh "$RUNNER_TEMP/govulncheck.json" scripts/ci/govulncheck-allow.txt

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          args: --verbose

      - name: Unit tests
        run: go test ./internal/... -cover -v

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.11"

      - name: Integration tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: go test ./tests/integration/... -cover -v -timeout 120s

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [check, integration]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build image
        run: docker build -f build/Dockerfile -t chatbot-go:latest .

      - name: Verify image
        run: docker images chatbot-go:latest

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: chatbot-go:latest
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: chatbot-go:latest
          severity: CRITICAL,HIGH
          exit-code: "1"

  # [F303-17] Browser tests for the LIFF page: the real page served by a Go fake API, driven by headless Chrome.
  # Deliberately not in any `needs` and not a build prerequisite: it runs beside `check`. A red run still blocks merging
  # by the usual rule that every CI job must be green.
  # Chrome and Node come preinstalled on the runner image (no extra action); the version step prints them and fails below the floor.
  # Unverified until the first run: the Chrome sandbox on this image. If Chrome reports "No usable sandbox", add
  # LIFF_E2E_NO_SANDBOX: "1" to the browser step (all traffic is confined to loopback by the test harness) and record the result here.
  # Run time to be filled in after the first run: not measured yet.
  e2e-liff:
    name: E2E (LIFF)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.11"

      - name: Check Node and Chrome versions
        run: |
          set -eu
          node --version
          google-chrome --version
          node_major=$(node -p 'process.versions.node.split(".")[0]')
          chrome_major=$(google-chrome --version | grep -oE '[0-9]+' | head -n 1)
          if [ "$node_major" -lt 22 ]; then echo "Node 22 or newer is required, found $node_major" >&2; exit 1; fi
          if [ "$chrome_major" -lt 120 ]; then echo "Chrome 120 or newer is required, found $chrome_major" >&2; exit 1; fi

      - name: Fake server tests
        run: go test ./tests/e2e/liff/server/... -count=1

      - name: Browser tests
        run: |
          set -eu
          out="$RUNNER_TEMP/liff-e2e"
          mkdir -p "$out"
          go build -o "$out/server" ./tests/e2e/liff/server
          rc=0
          LIFF_E2E_SERVER_BIN="$out/server" node --test --test-timeout=60000 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination="$out/junit.xml" \
            tests/e2e/liff/*.test.mjs || rc=$?
          report=0
          node tests/e2e/liff/control.mjs --verify-report "$out/junit.xml" || report=$?
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          exit "$report"

      - name: Print the JUnit report
        if: failure()
        run: cat "$RUNNER_TEMP/liff-e2e/junit.xml"
