name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.11"
          # [SE41-01] setup-go restores with tar -P (actions/setup-go@40f1582 dist/setup/index.js:2635-2638), so a cache
          # entry saved by an earlier run of the same PR can write anywhere the runner can (module trees, go env, the
          # toolchain). [F42-01] secret-scan_test.sh pins the identity, order and keys of this job's first six steps
          # (checkout, this setup-go with the cache off, Install gitleaks, Secret scan, Install govulncheck,
          # Govulncheck), the two install run lines, a single setup-go, and no workflow or job env: / defaults:.
          cache: false

      # [F39-17] Install gitleaks and Secret scan come first: no repo script may run before the scan. A script that
      # ran earlier could write .git/info/attributes (GIT_ATTR_SOURCE does not cover it), export GIT_CONFIG_* through
      # $GITHUB_ENV, or replace the gitleaks binary, and the scan would miss files without failing.
      # [PR37 SE37-01] gitleaks-action lists PR commits through the API without paging and scanned only the first 30.
      # Run the pinned CLI on the git range instead (checkout uses fetch-depth: 0, so every commit is local).
      # [F40-09][SE39-06] Fresh GOMODCACHE/GOCACHE as an extra layer: the scanners never build from a directory a
      # later step may also use. What blocks a poisoned cache is the disabled setup-go cache above, not these paths.
      - name: Install gitleaks
        run: GOMODCACHE="$RUNNER_TEMP/gitleaks-mod" GOCACHE="$RUNNER_TEMP/gitleaks-build" go install github.com/zricethezav/gitleaks/v8@v8.24.3

      - name: Secret scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # gitleaks loads ./.gitleaks.toml when no --config is given: a PR must not bring its own scan config
          test ! -e .gitleaks.toml || { echo '::error file=.gitleaks.toml::gitleaks would load this PR-controlled config; remove it or change this workflow on purpose'; exit 1; }
          case "$EVENT_NAME" in
            pull_request) range=("$PR_BASE..$PR_HEAD") ;;
            push)
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                # a push that creates the branch: scan every commit it brings in, not only the tip
                if [ "$GITHUB_REF_NAME" = main ]; then
                  range=("$GITHUB_SHA")
                else
                  range=("origin/main..$GITHUB_SHA")
                fi
              else
                range=("$PUSH_BEFORE..$GITHUB_SHA")
              fi
              ;;
            *) range=("origin/main..$GITHUB_SHA") ;;
          esac
          count=$(git rev-list --no-merges --count "${range[@]}")
          if [ "$count" -eq 0 ]; then
            # e.g. workflow_dispatch on main: origin/main..sha is empty, so scan the checked-out commit itself
            echo "range empty, scanning $GITHUB_SHA only"
            range=(-1 "$GITHUB_SHA")
            count=1
          fi
          echo "commits in range: $count"
          # [F39-05] earlier steps can export these through $GITHUB_ENV; they would replace the scan rules
          unset GITLEAKS_CONFIG GITLEAKS_CONFIG_TOML
          # [F39-06] a PR must not wave its own findings through .gitleaksignore: scan PRs with the base branch's copy.
          # gitleaks always reads ./.gitleaksignore (--gitleaks-ignore-path only adds another file), so replace the checked-out one.
          # gitleaks:allow on the line itself still works and shows up in the diff under review.
          if [ "$EVENT_NAME" = pull_request ]; then
            if git cat-file -e "$PR_BASE:.gitleaksignore" 2>/dev/null; then
              git show "$PR_BASE:.gitleaksignore" > .gitleaksignore
            else
              rm -f .gitleaksignore
            fi
          fi
          # [F39-05] a PR-added .gitattributes "-diff" makes git log show files as binary and gitleaks skips them:
          # read attributes from the empty tree so a PR .gitattributes cannot mark files -diff. An older git ignores
          # GIT_ATTR_SOURCE silently, so prove this git honours it before trusting the scan.
          # [F39-16] Still not scanned, by gitleaks design: a file git sees as binary (a NUL byte), a path on the
          # gitleaks default allowlist (any path containing gitleaks.toml; .png, .pdf, .zip and similar), and changes
          # that exist only in a merge commit (--no-merges). Blocking those is a CI policy choice, not done here.
          empty_tree=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          probe="$RUNNER_TEMP/attr-source-probe"
          rm -rf "$probe" && git init -q "$probe" && printf 'f -diff\n' > "$probe/.gitattributes"
          [ "$(GIT_ATTR_SOURCE=$empty_tree git -C "$probe" check-attr diff -- f)" = "f: diff: unspecified" ] \
            || { echo '::error::this git ignores GIT_ATTR_SOURCE, so a PR .gitattributes could hide files from the secret scan'; exit 1; }
          GIT_ATTR_SOURCE=$empty_tree "$(go env GOPATH)/bin/gitleaks" git --no-banner --redact --verbose \
            --log-opts="--no-merges ${range[*]}" .

      # [F241-01] pinned govulncheck + repo-side allowlist gate (see scripts/ci/govulncheck-allow.txt)
      # [F40-10][SE41-01] Installed and run right after the secret scan, before any repo script or cache restore
      # (the self-tests, vet, tidy and golangci-lint all come later). The binary runs first; only its JSON reaches the
      # repo's gate script.
      - name: Install govulncheck
        run: GOMODCACHE="$RUNNER_TEMP/govulncheck-mod" GOCACHE="$RUNNER_TEMP/govulncheck-build" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Govulncheck
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/govulncheck" -format json ./cmd/... ./internal/... > "$RUNNER_TEMP/govulncheck.json"
          bash scripts/ci/govulncheck-gate.sh "$RUNNER_TEMP/govulncheck.json" scripts/ci/govulncheck-allow.txt

      # [F39-05][F39-06][F39-15] runs the Secret scan block above against throwaway repos (hidden file, swapped rules,
      # self-allowed fingerprint, old git): a guard that quietly stops working turns this step red
      - name: Secret scan self-test
        run: bash scripts/ci/secret-scan_test.sh

      - name: Go vet
        run: go vet ./...

      - name: Go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Govulncheck gate self-test
        run: bash scripts/ci/govulncheck-gate_test.sh

      # [F37-22] golangci-lint-action silently builds and runs a custom binary when one of these files exists at the repo root
      - name: Refuse golangci-lint custom build config
        run: |
          set -eu
          for f in .custom-gcl.yml .custom-gcl.yaml .custom-gcl.json; do
            if [ -e "$f" ]; then
              echo "::error file=$f::golangci-lint-action would build and run a custom binary instead of the pinned golangci-lint; remove $f or update this workflow on purpose"
              exit 1
            fi
          done

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.4
          args: --verbose

      # [F33-38] -race: the cooldown maps are written by concurrent requests; without it a lock removal only shows up by luck
      - name: Unit tests
        run: go test ./internal/... -race -cover -v

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.11"

      - name: Integration tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: go test ./tests/integration/... -cover -v -timeout 120s

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [check, integration]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build image
        run: docker build -f build/Dockerfile -t chatbot-go:latest .

      - name: Verify image
        run: docker images chatbot-go:latest

      # [F37-21] the syft download from GitHub releases sometimes fails with a 504; retry once after a pause
      - name: Generate SBOM
        id: sbom
        continue-on-error: true
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: chatbot-go:latest
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Wait before SBOM retry
        if: steps.sbom.outcome == 'failure'
        run: sleep 30

      - name: Generate SBOM (retry)
        if: steps.sbom.outcome == 'failure'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: chatbot-go:latest
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: chatbot-go:latest
          severity: CRITICAL,HIGH
          exit-code: "1"

  # [F303-17] Browser tests for the LIFF page: the real page served by a Go fake API, driven by headless Chrome.
  # Deliberately not in any `needs` and not a build prerequisite: it runs beside `check`. A red run still blocks merging
  # by the usual rule that every CI job must be green.
  # Chrome and Node come preinstalled on the runner image (no extra action); the version step prints them and fails below the floor.
  # [F37-23] Chrome sandbox: verified to start on ubuntu-24.04 without --no-sandbox. Do not set LIFF_E2E_NO_SANDBOX in CI.
  # The harness only blocks non-loopback http(s) requests made by the test tab; it is not a network sandbox.
  # Run time: about 33-67 s per run (median about 50 s), measured over 10 runs on 2026-11-23/24.
  e2e-liff:
    name: E2E (LIFF)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.11"

      - name: Check Node and Chrome versions
        run: |
          set -eu
          node --version
          google-chrome --version
          node_major=$(node -p 'process.versions.node.split(".")[0]')
          chrome_major=$(google-chrome --version | grep -oE '[0-9]+' | head -n 1)
          if [ "$node_major" -lt 22 ]; then echo "Node 22 or newer is required, found $node_major" >&2; exit 1; fi
          if [ "$chrome_major" -lt 120 ]; then echo "Chrome 120 or newer is required, found $chrome_major" >&2; exit 1; fi

      - name: Fake server tests
        run: go test ./tests/e2e/liff/server/... -count=1

      - name: Browser tests
        run: |
          set -eu
          out="$RUNNER_TEMP/liff-e2e"
          mkdir -p "$out"
          go build -o "$out/server" ./tests/e2e/liff/server
          rc=0
          LIFF_E2E_SERVER_BIN="$out/server" node --test --test-timeout=60000 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination="$out/junit.xml" \
            tests/e2e/liff/*.test.mjs || rc=$?
          report=0
          node tests/e2e/liff/control.mjs --verify-report "$out/junit.xml" || report=$?
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          exit "$report"

      - name: Print the JUnit report
        if: failure()
        run: cat "$RUNNER_TEMP/liff-e2e/junit.xml"
