server:
  port: 8080
  # HTTPS 反向代理的位址範圍（逗號分隔 CIDR）；沒設時所有人看起來都是代理的 IP，限流會變成全體共用
  trusted_proxies: ${TRUSTED_PROXIES}

database:
  mongo:
    uri: ${MONGO_URI}
    name: chatbot-go
  redis:
    addr: ${REDIS_ADDR}
    password: ${REDIS_PASSWORD}
    db: 0

line:
  channel_secret: ${LINE_CHANNEL_SECRET}
  channel_token: ${LINE_CHANNEL_TOKEN}
  reply_url: https://api.line.me/v2/bot/message/reply
  push_url: https://api.line.me/v2/bot/message/push
  content_url: https://api-data.line.me/v2/bot/message
  loading_url: https://api.line.me/v2/bot/chat/loading/start

weather:
  # 預報每天 4 次，台灣時間（Asia/Taipei），氣象署 05:30/11:30/17:30/23:30 發布後 10 分鐘；環境變數 CWA_FORECAST_CRON 可覆蓋，off = 停用.
  cron: "40 5,11,17,23 * * *"
  cwa_base_url: https://opendata.cwa.gov.tw/api/v1/rest/datastore
  cwa_auth_key: ${CWA_AUTH_KEY}
  rate_limit_ms: 2000
  cache_ttl_seconds: 3600

alert:
  # 各排程頻率可用環境變數覆蓋（CWA_WARNING_CRON 等）；只有字面 off 才停用該排程.
  warning_cron: "*/5 * * * *"
  earthquake_cron: "*/5 * * * *"
  tsunami_cron: "*/30 * * * *"
  cold_interval_minutes: 30
  earthquake_limit: 5
  weather_dataset: "W-C0033-001"
  earthquake_dataset: "E-A0015-001"
  tsunami_dataset: "E-A0014-001"
  check_timeout_seconds: 120

# 氣象署呼叫的重試與每日額度；每項都可用環境變數覆蓋（CWA_MAX_ATTEMPTS 等），值無效時退回程式碼預設.
cwa:
  max_attempts: 2
  daily_limit: 1000
  safety_ratio: 0.95
  warn_ratio: 0.8
  exhausted_status_codes: "429"

ai:
  # 金鑰都沒設時 AI 功能自動停用；順序留空用預設
  provider_order: ${AI_PROVIDER_ORDER}
  vision_provider_order: ${AI_VISION_PROVIDER_ORDER}
  gemini_api_key: ${GEMINI_API_KEY}
  groq_api_key: ${GROQ_API_KEY}
  nvidia_api_key: ${NVIDIA_API_KEY}
  # Claude 只用在自由問答（付費）；沒設時問答改用上面的免費供應商
  anthropic_api_key: ${ANTHROPIC_API_KEY}
  claude_model: ${CLAUDE_MODEL}
  qa_provider_order: ${AI_QA_PROVIDER_ORDER}

liff:
  # LIFF 統計頁；兩個都設才啟用（LIFF 要建在 LINE Login channel，且與 Messaging API channel 同一個 Provider）
  id: ${LIFF_ID}
  channel_id: ${LINE_LOGIN_CHANNEL_ID}

logging:
  level: info
  file: /app/log/app.log

security:
  # 生產環境改用 Tink，金鑰集合由環境變數注入
  keyset: ${CRYPTO_KEYSET}
  admin_token: ${ADMIN_TOKEN}
